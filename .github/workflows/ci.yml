name: CI

on:
  push:
    # milestone-* branches let heavy changes (the real-model e2e job) be validated before main moves.
    branches: [main, 'milestone-*']
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint and lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Lockfile matches pyproject.toml
        run: uv lock --check
      - run: uv sync --only-group dev
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .

  unit:
    name: Unit tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.12']
        include:
          - { os: ubuntu-latest, python: '3.10' }
          - { os: ubuntu-latest, python: '3.13' }
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      # Unit tests replace Docling with fakes, so only the dev tools are installed.
      - run: uv sync --only-group dev
      - run: uv run --no-sync pytest tests/unit --cov --cov-report=term-missing --cov-fail-under=95

  package:
    name: Build and install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv build
      - name: Installed command starts
        run: |
          uv venv /tmp/pkg
          uv pip install --python /tmp/pkg/bin/python --no-deps dist/*.whl
          /tmp/pkg/bin/book2md --version
          /tmp/pkg/bin/book2md --help
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  e2e:
    name: End-to-end (real Docling models)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # No uv cache here: the locked torch/CUDA wheels are several GB.
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Cache Docling model weights
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: docling-models-${{ hashFiles('uv.lock') }}
          restore-keys: docling-models-
      - name: Install the locked environment
        run: uv sync
      - name: Run the end-to-end tests
        env:
          BOOK2MD_REQUIRE_DOCLING: '1'
          BOOK2MD_E2E_ARTIFACTS: e2e-output
        run: uv run --no-sync pytest tests/e2e -v -ra --durations=5
      - name: Upload converted sample pages
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-output
          path: e2e-output/
          retention-days: 7
